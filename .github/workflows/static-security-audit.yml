name: Static security audit

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/codex-observer
    paths-ignore:
      - audit/security/**

permissions:
  contents: write

concurrency:
  group: static-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out hardening branch without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Scan tracked source without installing or starting the app
        run: node scripts/static-security-audit.mjs

      - name: Upload raw static-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes3d-static-security-audit
          path: audit/security
          if-no-files-found: error
          retention-days: 14

      - name: Publish static-audit report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f audit/security/STATIC_AUDIT.md || ! -f audit/security/static-audit.json ]]; then
            echo "Static audit did not produce its expected reports."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- audit/security/STATIC_AUDIT.md audit/security/static-audit.json
          if git diff --cached --quiet; then
            echo "Static security report is unchanged."
            exit 0
          fi
          git commit -m "chore: publish static security audit [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:hardening/codex-observer

      - name: Block on critical automated findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("audit/security/static-audit.json", "utf8"));
          const blocking = Number(report.blockingCount ?? 0);
          if (blocking > 0) {
            console.error(`Static audit found ${blocking} blocking finding(s).`);
            process.exit(1);
          }
          console.log("No blocking static-audit findings.");
          NODE
