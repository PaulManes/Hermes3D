name: Isolated dependency refresh

on:
  push:
    branches:
      - hardening/codex-observer
    paths:
      - .github/workflows/dependency-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use current Node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/dependencies
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
            echo "commit=${GITHUB_SHA}"
          } | tee audit/dependencies/toolchain.txt

      - name: Record current direct dependency drift
        shell: bash
        run: |
          set -uo pipefail
          npm outdated --json > audit/dependencies/outdated-before.json 2>audit/dependencies/outdated-before.stderr
          exit 0

      - name: Update every direct dependency to latest stable
        shell: bash
        run: |
          set -euo pipefail
          npx --yes npm-check-updates@latest --target latest --upgrade
          npm install --package-lock-only --ignore-scripts

      - name: Record dependency install scripts before execution
        shell: bash
        run: |
          set -euo pipefail
          npm query ':attr(scripts)' > audit/dependencies/packages-with-scripts.json

      - name: Install in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci

      - name: Run npm audits
        shell: bash
        run: |
          set -uo pipefail
          npm audit --json > audit/dependencies/npm-audit-all.json
          all_status=$?
          npm audit --omit=dev --json > audit/dependencies/npm-audit-production.json
          production_status=$?
          printf 'all=%s\nproduction=%s\n' "$all_status" "$production_status" > audit/dependencies/audit-exit-codes.txt
          exit 0

      - name: Run verification suite
        shell: bash
        run: |
          set +e
          mkdir -p audit/dependencies/logs

          npm run lint > audit/dependencies/logs/lint.log 2>&1
          lint_status=$?

          npm run typecheck > audit/dependencies/logs/typecheck.log 2>&1
          typecheck_status=$?

          npm run test -- --run > audit/dependencies/logs/test.log 2>&1
          test_status=$?

          npm run build > audit/dependencies/logs/build.log 2>&1
          build_status=$?

          npm run smoke:dev-server > audit/dependencies/logs/smoke.log 2>&1
          smoke_status=$?

          {
            echo "lint=$lint_status"
            echo "typecheck=$typecheck_status"
            echo "test=$test_status"
            echo "build=$build_status"
            echo "smoke=$smoke_status"
          } | tee audit/dependencies/verification-exit-codes.txt

          exit 0

      - name: Generate human-readable report
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.join('audit', 'dependencies');
          const read = (name) => {
            try { return fs.readFileSync(path.join(root, name), 'utf8').trim(); }
            catch { return ''; }
          };
          const json = (name) => {
            try { return JSON.parse(read(name) || '{}'); }
            catch { return {}; }
          };
          const parseCodes = (text) => Object.fromEntries(
            text.split(/\r?\n/).filter(Boolean).map((line) => {
              const index = line.indexOf('=');
              return index === -1 ? [line, ''] : [line.slice(0, index), line.slice(index + 1)];
            })
          );
          const auditSummary = (value) => value?.metadata?.vulnerabilities ?? {};
          const checks = parseCodes(read('verification-exit-codes.txt'));
          const auditCodes = parseCodes(read('audit-exit-codes.txt'));
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const allAudit = auditSummary(json('npm-audit-all.json'));
          const prodAudit = auditSummary(json('npm-audit-production.json'));
          const scripts = json('packages-with-scripts.json');
          const scriptCount = Array.isArray(scripts) ? scripts.length : 0;
          const ok = (code) => String(code) === '0' ? 'PASS' : 'FAIL';
          const dependencyRows = [
            ...Object.entries(packageJson.dependencies ?? {}).map(([name, version]) => `| ${name} | ${version} | runtime |`),
            ...Object.entries(packageJson.devDependencies ?? {}).map(([name, version]) => `| ${name} | ${version} | development |`),
          ].sort();
          const report = `# Dependency Refresh Report

Generated by the isolated macOS dependency-refresh workflow.

## Toolchain

\`\`\`
${read('toolchain.txt')}
\`\`\`

## Verification

| Check | Result | Exit code |
| --- | --- | ---: |
| Lint | ${ok(checks.lint)} | ${checks.lint ?? 'missing'} |
| Typecheck | ${ok(checks.typecheck)} | ${checks.typecheck ?? 'missing'} |
| Unit tests | ${ok(checks.test)} | ${checks.test ?? 'missing'} |
| Production build | ${ok(checks.build)} | ${checks.build ?? 'missing'} |
| Dev-server smoke test | ${ok(checks.smoke)} | ${checks.smoke ?? 'missing'} |

## npm audit

| Scope | Critical | High | Moderate | Low | Total | Exit code |
| --- | ---: | ---: | ---: | ---: | ---: | ---: |
| All dependencies | ${allAudit.critical ?? 0} | ${allAudit.high ?? 0} | ${allAudit.moderate ?? 0} | ${allAudit.low ?? 0} | ${allAudit.total ?? 0} | ${auditCodes.all ?? 'missing'} |
| Production only | ${prodAudit.critical ?? 0} | ${prodAudit.high ?? 0} | ${prodAudit.moderate ?? 0} | ${prodAudit.low ?? 0} | ${prodAudit.total ?? 0} | ${auditCodes.production ?? 'missing'} |

## Lifecycle-script surface

The refreshed tree contains **${scriptCount}** installed packages that declare one or more npm lifecycle scripts. The complete machine-readable list is in \`packages-with-scripts.json\`.

## Refreshed direct dependencies

| Package | Requested version | Scope |
| --- | --- | --- |
${dependencyRows.join('\n')}

## Raw evidence

- \`outdated-before.json\`
- \`packages-with-scripts.json\`
- \`npm-audit-all.json\`
- \`npm-audit-production.json\`
- \`logs/lint.log\`
- \`logs/typecheck.log\`
- \`logs/test.log\`
- \`logs/build.log\`
- \`logs/smoke.log\`
`;
          fs.writeFileSync(path.join(root, 'REPORT.md'), report);
          NODE

      - name: Commit refreshed dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json audit/dependencies
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh dependencies and capture audit evidence [skip ci]"
          git push origin HEAD:hardening/codex-observer
