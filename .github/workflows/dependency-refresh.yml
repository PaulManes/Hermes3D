name: Isolated dependency refresh

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/codex-observer
    paths:
      - .github/workflows/dependency-refresh.yml
      - scripts/generate-dependency-report.mjs
      - scripts/list-dependency-lifecycle-scripts.mjs

permissions:
  contents: write

concurrency:
  group: dependency-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - name: Check out hardening branch without persisted credentials
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/dependencies/logs
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
            echo "commit=${GITHUB_SHA}"
          } | tee audit/dependencies/toolchain.txt

      - name: Record current dependency drift
        shell: bash
        run: |
          set +e
          npm outdated --json > audit/dependencies/outdated-before.json 2> audit/dependencies/outdated-before.stderr
          status=$?
          if [[ ! -s audit/dependencies/outdated-before.json ]]; then
            printf '{}\n' > audit/dependencies/outdated-before.json
          fi
          printf 'npm_outdated=%s\n' "$status" > audit/dependencies/outdated-exit-code.txt
          exit 0

      - name: Refresh patch and minor dependency releases
        shell: bash
        run: |
          set -euo pipefail
          npx --yes npm-check-updates@latest --target minor --upgrade \
            | tee audit/dependencies/logs/npm-check-updates.log
          npm install --package-lock-only --ignore-scripts --strict-peer-deps

      - name: Install dependency tree with lifecycle scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --ignore-scripts --strict-peer-deps

      - name: Inventory install-time lifecycle scripts
        run: node scripts/list-dependency-lifecycle-scripts.mjs

      - name: Execute required lifecycle scripts only on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          npm rebuild --foreground-scripts 2>&1 \
            | tee audit/dependencies/logs/lifecycle-rebuild.log

      - name: Run npm security audits
        shell: bash
        run: |
          set +e
          npm audit --json > audit/dependencies/npm-audit-all.json
          all_status=$?
          npm audit --omit=dev --json > audit/dependencies/npm-audit-production.json
          production_status=$?
          printf 'all=%s\nproduction=%s\n' "$all_status" "$production_status" \
            > audit/dependencies/audit-exit-codes.txt
          exit 0

      - name: Run verification suite
        shell: bash
        run: |
          set +e
          npm ls --all > audit/dependencies/logs/npm-ls.log 2>&1
          peer_tree_status=$?
          npm run lint > audit/dependencies/logs/lint.log 2>&1
          lint_status=$?
          npm run typecheck > audit/dependencies/logs/typecheck.log 2>&1
          typecheck_status=$?
          npm run test -- --run > audit/dependencies/logs/test.log 2>&1
          test_status=$?
          npm run build > audit/dependencies/logs/build.log 2>&1
          build_status=$?
          npm run smoke:dev-server > audit/dependencies/logs/smoke.log 2>&1
          smoke_status=$?
          {
            echo "peer_tree=$peer_tree_status"
            echo "lint=$lint_status"
            echo "typecheck=$typecheck_status"
            echo "test=$test_status"
            echo "build=$build_status"
            echo "smoke=$smoke_status"
          } | tee audit/dependencies/verification-exit-codes.txt
          exit 0

      - name: Capture candidate dependency files
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p audit/dependencies
          cp package.json audit/dependencies/candidate-package.json
          cp package-lock.json audit/dependencies/candidate-package-lock.json
          git diff -- package.json package-lock.json \
            > audit/dependencies/dependency-refresh.patch
          exit 0

      - name: Generate dependency report
        if: always()
        run: node scripts/generate-dependency-report.mjs

      - name: Upload raw audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermes3d-dependency-audit
          path: audit/dependencies
          if-no-files-found: error
          retention-days: 14

      - name: Publish audit report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f audit/dependencies/REPORT.md ]]; then
            echo "No report was generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- audit/dependencies/REPORT.md
          if git diff --cached --quiet; then
            echo "Dependency report is unchanged."
            exit 0
          fi
          git commit -m "chore: publish dependency refresh report [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:hardening/codex-observer

      - name: Enforce clean audit and verification results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for file in audit/dependencies/audit-exit-codes.txt audit/dependencies/verification-exit-codes.txt; do
            if [[ ! -f "$file" ]]; then
              echo "Missing result file: $file"
              failed=1
              continue
            fi
            while IFS='=' read -r check code; do
              if [[ -z "$check" || "$code" != "0" ]]; then
                echo "Failed: ${check:-unknown} (exit ${code:-missing})"
                failed=1
              fi
            done < "$file"
          done
          exit "$failed"

      - name: Commit verified dependency refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No verified dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh compatible dependencies [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:hardening/codex-observer
