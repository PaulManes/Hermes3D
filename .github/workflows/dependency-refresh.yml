name: Isolated dependency refresh

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/codex-observer
    paths:
      - .github/workflows/dependency-refresh.yml
      - scripts/generate-dependency-report.mjs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use current Node LTS
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/dependencies/logs
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
            echo "commit=${GITHUB_SHA}"
          } | tee audit/dependencies/toolchain.txt

      - name: Record current direct dependency drift
        continue-on-error: true
        shell: bash
        run: |
          npm outdated --json > audit/dependencies/outdated-before.json 2> audit/dependencies/outdated-before.stderr

      - name: Update direct dependencies and regenerate lockfile without scripts
        shell: bash
        run: |
          set -euo pipefail
          npx --yes npm-check-updates@latest --target latest --upgrade
          npm install --package-lock-only --ignore-scripts

      - name: Install dependency tree with lifecycle scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --ignore-scripts

      - name: Record packages that declare scripts
        shell: bash
        run: |
          set -euo pipefail
          npm query ':attr(scripts)' > audit/dependencies/packages-with-scripts.json

      - name: Execute required lifecycle scripts only on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          npm rebuild

      - name: Run npm security audits
        shell: bash
        run: |
          set +e
          npm audit --json > audit/dependencies/npm-audit-all.json
          all_status=$?
          npm audit --omit=dev --json > audit/dependencies/npm-audit-production.json
          production_status=$?
          printf 'all=%s\nproduction=%s\n' "$all_status" "$production_status" > audit/dependencies/audit-exit-codes.txt
          exit 0

      - name: Run verification suite
        shell: bash
        run: |
          set +e
          npm run lint > audit/dependencies/logs/lint.log 2>&1
          lint_status=$?
          npm run typecheck > audit/dependencies/logs/typecheck.log 2>&1
          typecheck_status=$?
          npm run test -- --run > audit/dependencies/logs/test.log 2>&1
          test_status=$?
          npm run build > audit/dependencies/logs/build.log 2>&1
          build_status=$?
          npm run smoke:dev-server > audit/dependencies/logs/smoke.log 2>&1
          smoke_status=$?
          {
            echo "lint=$lint_status"
            echo "typecheck=$typecheck_status"
            echo "test=$test_status"
            echo "build=$build_status"
            echo "smoke=$smoke_status"
          } | tee audit/dependencies/verification-exit-codes.txt
          exit 0

      - name: Generate dependency report
        run: node scripts/generate-dependency-report.mjs

      - name: Upload raw audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes3d-dependency-audit
          path: audit/dependencies
          if-no-files-found: warn
          retention-days: 14

      - name: Commit refreshed dependencies and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json audit/dependencies/REPORT.md
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh dependencies and capture audit report [skip ci]"
          git push origin HEAD:hardening/codex-observer

      - name: Enforce clean audit and verification results
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for file in audit/dependencies/audit-exit-codes.txt audit/dependencies/verification-exit-codes.txt; do
            if [[ ! -f "$file" ]]; then
              echo "Missing result file: $file"
              failed=1
              continue
            fi
            while IFS='=' read -r check code; do
              if [[ -z "$check" || "$code" != "0" ]]; then
                echo "Failed: ${check:-unknown} (exit ${code:-missing})"
                failed=1
              fi
            done < "$file"
          done
          exit "$failed"
