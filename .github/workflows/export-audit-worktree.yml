name: Export audit worktree

on:
  push:
    branches:
      - hardening/codex-observer
    paths:
      - .github/workflows/export-audit-worktree.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Archive tracked worktree
        run: |
          git archive --format=tar.gz --output=hermes3d-worktree.tar.gz HEAD
          shasum -a 256 hermes3d-worktree.tar.gz

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: hermes3d-audit-worktree
          path: hermes3d-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
